services:

  kafka:
    image: apache/kafka:4.0.0
    container_name: enade-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-producer:
    build:
      context: ./kafka/producer
      dockerfile: Dockerfile
    container_name: enade-kafka-producer
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_NAME: enade-questoes
      KAFKA_DLQ_TOPIC_NAME: enade-questoes-dlq
      INPUT_JSON_PATH: /app/extraction/questoes_enriquecidas.json
      CHECKPOINT_PATH: /app/data/checkpoint.json
    volumes:
      - ./extraction:/app/extraction:ro
      - producer_data:/app/data
    restart: on-failure

  kafka-consumer:
    build:
      context: ./kafka/consumer
      dockerfile: Dockerfile
    container_name: enade-kafka-consumer
    depends_on:
      - kafka
      - elasticsearch
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_NAME: enade-questoes
      KAFKA_CONSUMER_GROUP_ID: enade-es-indexer-group
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX_NAME: enade-questoes
      MAPPING_FILE_PATH: /app/elasticsearch/mapping.json
    volumes:
      - ./elasticsearch:/app/elasticsearch:ro
    restart: on-failure

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: enade-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7.4
    container_name: enade-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: enade-api
    ports:
      - "8000:8000"
    depends_on:
      - elasticsearch
      - redis
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX_NAME: enade-questoes
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: 300
      CARRINHO_TTL_SECONDS: 86400
    restart: on-failure

volumes:
  kafka_data:
  elasticsearch_data:
  redis_data:
  producer_data:
